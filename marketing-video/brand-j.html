<!doctype html>
<!--
  Ink Studio, juriaan.design J set: renders one finished picture per recipe below.
  make-examples.mjs calls window.__make(i) for each recipe and saves the PNG it returns into ../examples/.
  Each recipe loads a fresh copy of the app, sets it up differently, lets the ink run, and exports 1024 px.
-->
<html lang="en">
<head><meta charset="utf-8"><title>Ink Studio J set</title></head>
<body style="margin:0;background:#111">
<script>
// Ten square pictures of the letter J for juriaan.design: Helvetica Bold, two inks (brand red and #f7381d) on the brand's
// near-black, light or page grey. The J is an open outline, so the ink streams into the letter.
//   EXAMPLES_URL=http://localhost:8766/marketing-video/brand-j.html EXAMPLES_OUT=../juriaan-j node make-examples.mjs
// [file name, paper, letter colour or 'match' (= paper), style, wall, openings, opening width, brush, currents, 'heavy' / 'light' / null inking, grain, rotation]
const LIGHT = '#f4f4f4', PAGE = '#e4e4e4', BLACK = '#090302', RED = '#e30a20', ORANGE = '#f7381d', WHITE = '#ffffff';
const INKS = [RED, ORANGE], FONT = 10;   // 10 = Helvetica Bold in the app's font list
const BRUSH = { 'Fine dots': 0, Chunky: 1, Squares: 2, Gooey: 3, Liquid: 4 };
const FLOW = { Calm: 0, Lively: 1, Storm: 2, Whirlpool: 3, Rain: 4 };
const RECIPES = [
  ['01-black-carved',     BLACK, 'match', 'flat', .022, .62, .16, null,        'Lively',    'heavy', .2,  0],
  ['02-black-white-line', BLACK, WHITE,   'flat', .018, .70, .18, 'Fine dots', 'Storm',     'heavy', 0,   0],
  ['03-light-black-line', LIGHT, BLACK,   'flat', .024, .60, .15, 'Chunky',    'Lively',    'light', 0,   0],
  ['04-light-carved',     LIGHT, 'match', 'flat', .030, .55, .14, null,        'Whirlpool', 'heavy', 0,   0],
  ['05-grey-dotted-line', PAGE,  BLACK,   'blob', .022, .65, .18, 'Squares',   'Lively',    null,    0,   0],
  ['06-black-liquid',     BLACK, 'match', 'flat', .026, .60, .16, 'Liquid',    'Whirlpool', 'heavy', 0,   0],
  ['07-light-liquid',     LIGHT, BLACK,   'flat', .020, .66, .16, 'Liquid',    'Calm',      null,    0,   0],
  ['08-black-squares',    BLACK, WHITE,   'flat', .030, .55, .15, 'Squares',   'Rain',      null,    .15, 0],
  ['09-grey-white-line',      PAGE,  WHITE,   'flat', .034, .58, .14, 'Fine dots', 'Storm',     'heavy', 0,   0],
  ['10-black-tilted',     BLACK, 'match', 'blob', .026, .68, .16, 'Gooey',     'Lively',    null,    .25, -8],
];
window.__count = RECIPES.length;

function shim() {   // runs inside the app first: a hand-cranked clock and randomness seeded per example
  let now = 0; const q = [];
  window.requestAnimationFrame = cb => q.push(cb);
  performance.now = () => now;
  window.__clock = { step(ms) { now += ms; q.splice(0).forEach(cb => cb(now)); } };
  let seed = 7919 * (+window.name || 1);
  Math.random = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
let source;
const sleep = ms => new Promise(r => setTimeout(r, ms));

window.__make = async i => {
  const [name, paper, letter, style, wall, gaps, gapw, brush, flow, inking, grain, rot] = RECIPES[i], text = 'J', font = FONT, inkList = INKS, match = letter === 'match', inkCount = inkList.length;
  source ??= (await (await fetch('../index.html?' + Date.now())).text()).replace('<head>', `<head><script>(${shim})()<\/script><style>* { transition: none !important; animation: none !important; }</style>`);
  document.querySelector('iframe')?.remove();
  const frame = document.createElement('iframe'); frame.name = String(i + 1); frame.style.cssText = 'width:1400px;height:900px;border:0';
  frame.srcdoc = source; document.body.append(frame); await new Promise(r => { frame.onload = r; });
  const w = frame.contentWindow, d = w.document, $ = id => d.getElementById(id), q = sel => [...d.querySelectorAll(sel)];
  const stage = $('stage'); stage.setPointerCapture = () => {};
  const setVal = (id, v, ev = 'input') => { const el = $(id); if (el.type === 'checkbox') el.checked = v; else el.value = v; el.dispatchEvent(new w.Event(ev, { bubbles: true })); };
  const chip = (box, n) => q(`[data-presets=${box}] .chips button`)[n].click();
  const key = k => w.dispatchEvent(new w.KeyboardEvent('keydown', { key: k }));
  const pointer = (type, x, y) => { const r = stage.getBoundingClientRect(); stage.dispatchEvent(new w.PointerEvent(type, { clientX: r.left + x * r.width, clientY: r.top + y * r.height, pointerId: 1, bubbles: true })); };
  const step = n => { for (let k = 0; k < n; k++) w.__clock.step(1000 / 60); };
  await d.fonts.ready; await sleep(300);

  setVal('mode', 'paint', 'change');   // the app opens on the Letter tab; strokes only paint on Ink
  // colour: the brand's paper and inks, set straight into the tray
  q('#canvasShape + .segc button')[1].click();                   // square
  q('#inkCount + .segc button')[inkCount - 1].click();
  w.__ink.applyPalette({ name: 'juriaan.design', paper, inks: [0, 1, 2, 3].map(k => inkList[k % inkCount]), letter: match ? paper : letter });
  $('paperCustom').dispatchEvent(new w.Event('input', { bubbles: true }));
  const dark = d.documentElement.dataset.bsTheme === 'dark';     // near-black and red paper: ink adds light instead of darkening
  // letter
  q('.lrow button')[2].click();                                  // remove the starter letter
  setVal('font', $('font').options[font].value, 'change'); setVal('lsize', .8);
  $('text').value = text; $('add').click();
  chip('edges', 0); setVal('lstyle', style, 'change');           // start from a plain outline, then open it up
  setVal('wall', wall); setVal('gaps', gaps); setVal('gapw', gapw); setVal('grain', grain);
  if (match) $('matchPaper').click(); else setVal('letterColor', letter);
  // look and movement
  if (brush) chip('brush', BRUSH[brush]);
  chip('animate', FLOW[flow]);
  setVal('drips', true, 'change'); setVal('dripCycle', true, 'change'); const lots = !dark || match;   // a cut-out letter only shows when there is plenty of ink round it
  setVal('dripCount', lots ? 2 : 1); setVal('dripRate', lots ? .7 : .55); setVal('fade', dark ? .08 : .07); setVal('amount', dark ? .5 : .5); setVal('brush', .06);   // glowing ink on dark paper builds up fast, so use less of it
  if (inking === 'heavy') { setVal('amount', dark ? .7 : .8); setVal('fade', .03); setVal('dripCount', 2); setVal('brush', .075); }   // a carved letter needs ink all round it
  if (inking === 'light') { setVal('amount', .38); setVal('fade', .14); setVal('dripCount', 1); }
  $('clear').click();
  await d.fonts.load(`700 40px ${$('font').value.split('|')[1]}`, text).catch(() => {}); await sleep(250); setVal('lrot', rot);   // make sure the typeface is drawn

  // let it run: puffs of ink plus three brush sweeps, each in the next ink
  const R = () => w.Math.random();
  for (let s = 0; s < (inking === 'heavy' ? 4 : 3); s++) {
    step(70);
    key(String(1 + (s % inkCount)));
    const a0 = R() * 6.28, da = (R() < .5 ? -1 : 1) * (1.6 + R() * 1.6), rad = .2 + R() * .18, N = 34;
    for (let k = 0; k <= N; k++) { const a = a0 + da * k / N, x = .5 + rad * Math.cos(a), y = .5 + rad * Math.sin(a); pointer(k ? 'pointermove' : 'pointerdown', x, y); step(2); }
    pointer('pointerup', .5, .5);
  }
  step(match ? 200 : 110);

  const blob = await w.__ink.snapshot(1024);
  const data = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
  return { name, data };
};
window.__ready = true;
</script>
</body>
</html>
